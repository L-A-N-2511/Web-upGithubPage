<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng tin cho thuê - Tìm Trọ Nhanh</title>
    <link rel="icon" type="image/png" href="../image/logo01.png">
    <link rel="stylesheet" href="dang-tin.css">
</head>

<body>

    <div class="post-container">
        
        <a href="../index.html" class="back-link">
            ← Quay lại Trang chủ
        </a>

        <div class="post-form-box">
            
            <div class="form-brand-logo">
                <img src="../image/logo01.png" alt="Logo Tìm Trọ Nhanh">
            </div>

            <h2>Đăng tin phòng trọ</h2>
            <p>Nhập thông tin chi tiết để tiếp cận hàng ngàn người thuê</p>

            <form action="#" method="POST" class="form-content">

                <div class="form-group">
                    <label>Tiêu đề bài đăng <span style="color:red">*</span></label>
                    <input type="text" id="title" placeholder="VD: Phòng trọ giá rẻ đường Cầu Giấy, đầy đủ đồ..." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Giá cho thuê (VND) <span style="color:red">*</span></label>
                        <input type="number" id="price" placeholder="VD: 3500000" required>
                    </div>
                    <div class="form-group">
                        <label>Diện tích (m²) <span style="color:red">*</span></label>
                        <input type="number" id="area" placeholder="VD: 25" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Khu vực <span style="color:red">*</span></label>
                    <div class="address-select-group">
                        <select id="post-city" required>
                            <option value="">-- Chọn Tỉnh/Thành --</option>
                        </select>
                        <select id="post-district" required>
                            <option value="">-- Chọn Quận/Huyện --</option>
                        </select>
                        <select id="post-ward" required>
                            <option value="">-- Chọn Phường/Xã --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Địa chỉ cụ thể <span style="color:red">*</span></label>
                    <input type="text" id="post-street" placeholder="VD: Số 8 ngõ 15 đường Cầu Giấy..." required>
                </div>

                <div class="form-group">
                    <label>Mô tả chi tiết & Tiện ích</label>
                    <textarea rows="5" id="description"
                        placeholder="VD: Điện 3.5k/số, Nước 100k/người. Vệ sinh khép kín. Có chỗ để xe tầng 1 free..."></textarea>
                </div>

                <div class="form-group">
                    <label>Hình ảnh phòng trọ</label>
                    <div class="upload-box-modern">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                            stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>

                        <p>Kéo ảnh vào đây</p>
                        <span class="or-text">hoặc</span>

                        <input type="file" id="real-file-input" multiple hidden>
                        
                        <label for="real-file-input" class="btn-custom-upload">Tải ảnh lên</label>

                        <p class="file-hint">Hỗ trợ ảnh JPG, PNG</p>

                        <div id="image-preview-container"></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit-post">Đăng tin ngay</button>
            </form>
        </div>
    </div>
    <script src="../config.js"></script> 
    <script src="dang-tin.js"></script>
</body>

</html>
