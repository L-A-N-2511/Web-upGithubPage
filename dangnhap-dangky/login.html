<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Tìm Trọ Nhanh</title>
    <link rel="icon" type="image/png" href="../image/logo01.png">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-body">

    <div class="auth-box">
        <div class="auth-logo">
            <a href="../index.html">
                <img src="../image/logo01.png" alt="Logo">
            </a>
        </div>
        
        <h2>Chào mừng trở lại!</h2>
        <p class="auth-subtitle">Vui lòng đăng nhập để tiếp tục</p>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" id="login-username" placeholder="Nhập username của bạn" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn-auth">Đăng Nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
        <div class="auth-footer back-home">
            <a href="../index.html">← Quay lại trang chủ</a>
        </div>
    </div>
    <script src="../config.js"></script> 
    <script src="auth.js"></script>
</body>
</html>
